# Publica el prototipo en GitHub Pages al actualizar la rama principal.
# Requiere activar Pages una vez: Settings → Pages → Source: «GitHub Actions».
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Se publica solo lo que el navegador necesita (sin pruebas ni configuración).
      - run: mkdir _site && cp -r index.html styles.css js assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
