# Verifica el prototipo en cada cambio: estilo de código (ESLint + Prettier) y pruebas
# de extremo a extremo con Playwright, incluida la auditoría de accesibilidad con axe-core.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    # Versión fija: ubuntu-latest ya apunta a 26.04, que Playwright aún no soporta.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npx prettier --check "js/**/*.js" "tests/**/*.js"
      - run: npm test
