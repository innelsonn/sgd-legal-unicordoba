# Verifica el prototipo en cada cambio: estilo de código (ESLint + Prettier) y pruebas
# de extremo a extremo con Playwright, incluida la auditoría de accesibilidad con axe-core.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npx prettier --check "js/**/*.js" "tests/**/*.js"
      - run: npm test
